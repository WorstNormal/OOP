plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'checkstyle'
    id 'jacoco'
}

group = 'ru.nsu.gaev'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

javafx {
    version = '20.0.2'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.base']
}

// Прямая и понятная настройка Checkstyle
checkstyle {
    toolVersion = "10.12.4"
    
    // Укажите здесь путь к вашему файлу (относительно корня проекта).
    // Стандартный путь, который ожидает Gradle, указан ниже:
    configFile = file("config/checkstyle/checkstyle.xml") 
    
    // Если вы хотите, чтобы проект собирался даже при ошибках стиля 
    // (ошибки будут просто писаться в консоль, но сборка не упадет):
    // ignoreFailures = true
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'ru.nsu.gaev.snake.Main'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
}